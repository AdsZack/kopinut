<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kopinut</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body class="bg-black">
    <div class="grid h-screen grid-cols-[50px_minmax(0,1fr)] overflow-hidden">
      <!-- Sidebar -->
      <aside
        class="relative z-0 flex min-w-0 flex-col items-center overflow-hidden p-3 bg-black"
      >
        <button class="w-6 h-6 shrink-0">
          <img src="src/assets/icons/line-1.svg" alt="line" />
        </button>

        <div
          id="category-list"
          class="flex min-h-0 w-full flex-1 flex-row-reverse text-xs items-center gap-8 justify-center -rotate-90 text-white"
        >
          <button data-category="dessert" class="focus:font-bold">
            Desert
          </button>
          <button data-category="snack" class="focus:font-bold">Snack</button>
          <button data-category="meal" class="focus:font-bold">Meal</button>
          <button data-category="juice" class="focus:font-bold">Juice</button>
          <button data-category="tea" class="focus:font-bold">Tea</button>
          <button data-category="coffee" class="focus:font-bold">Coffee</button>
        </div>
      </aside>

      <!-- Header -->
      <div
        class="grid bg-white min-h-0 grid-rows-[58px_minmax(0,1fr)] rounded-l-4xl"
      >
        <header class="flex justify-between px-3 items-center">
          <div class="flex items-center gap-10">
            <h1 class="text-2xl font-bold w-18">Coffee</h1>
            <div
              class="flex items-center border w-150 rounded-md p-1 h-8 gap-1"
            >
              <img
                src="src/assets/icons/search.svg"
                alt="search"
                class="w-5 h-5 p-1"
              />
              <input
                type="search"
                name=""
                id=""
                class="flex-1 focus:outline-none"
                placeholder="Search for coffee, meal, etc"
              />
            </div>
          </div>
          <div class="flex w-90 items-center gap-5 justify-between">
            <nav class="flex gap-3">
              <a
                href="/receipts"
                class="bg-white rounded-md shadow w-9 h-9 p-1"
              >
                <img src="src/assets/icons/receipt.svg" alt="receipt" />
              </a>
              <a href="/stats" class="bg-white rounded-md shadow w-9 h-9 p-1">
                <img src="src/assets/icons/stat.svg" alt="stats" />
              </a>
              <a href="/setting" class="bg-white rounded-md w-9 h-9 shadow p-1">
                <img src="src/assets/icons/setting.svg" alt="setting" />
              </a>
            </nav>
            <div class="flex gap-3 items-center">
              <img
                src="src/assets/profile.jpeg"
                alt="profile"
                class="w-9 h-9 rounded-2xl border"
              />
              <h2>Cashier</h2>
              <button class="n-0">
                <img
                  src="src/assets/icons/dropdown.svg"
                  alt="dropdown"
                  class="w-6 h-6"
                />
              </button>
            </div>
          </div>
        </header>

        <!-- Main Content -->
        <main
          class="grid min-h-0 min-w-0 grid-cols-[minmax(0,1fr)_500px] gap-2 p-2"
        >
          <!-- Main Menu -->
          <div class="flex flex-col min-w-0 min-h-0 gap-6 px-1">
            <!-- Filter Menu -->
            <div
              id="subcategory-list"
              class="flex shrink-0 flex-wrap gap-3 items-center mx-2"
            >
              <button id="data-sub-category"></button>
            </div>

            <!-- Card Menu -->
            <div
              id="menu-list"
              class="grid grid-cols-3 min-h-0 flex-1 content-start gap-5 overflow-y-auto"
            ></div>
          </div>

          <!-- Checkout -->
          <div
            class="flex border flex-col min-h-0 gap-3 rounded-2xl bg-gray-200 shadow-lg p-3"
          >
            <div class="flex flex-row justify-between">
              <h3 class="font-bold">Order #123</h3>
              <button
                id="clear-checkout"
                class="bg-gray-200 shadow p-1 rounded-md text-sm"
              >
                Clear all
              </button>
            </div>
            <div
              id="checkout-list"
              class="flex flex-col flex-1 gap-2 overflow-y-auto"
            ></div>
            <div class="flex flex-col gap-2">
              <div class="flex justify-between">
                <h3 class="font-bold">Subtotal</h3>
                <h3 id="subtotal-value">Rp0</h3>
              </div>
              <div class="flex justify-between">
                <h3 class="font-bold">Tax</h3>
                <h3 id="tax-value">Rp0</h3>
              </div>
              <hr class="border-black" />
              <div class="flex justify-between">
                <h3 class="font-bold">Total</h3>
                <h3 id="total-value">Rp0</h3>
              </div>
            </div>
            <div class="flex flex-col min-h-10 mt-5">
              <button
                class="bg-black shadow text-white font-bold rounded-md h-10"
              >
                Print Receipts
              </button>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
